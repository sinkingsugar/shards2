name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path examples/esp32/Cargo.toml --all --check
      - run: python3 -m unittest discover -s bench/vm-execution -v
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --release --workspace
      # Small builds: shard documentation prose compiled out, contract kept.
      - run: cargo test -p shards-core -p shards-io --no-default-features --test metadata --test catalog
      - run: cargo test -p shards-lang --no-default-features
      # Release builds must run flows nested to the compose limit (compose still recurses).
      - run: cargo test --release -p shards-lang --test lang nesting_up_to_the_limit
      # As in 1.x, TLS is an explicit feature; make sure the rustls-ring build works.
      - run: cargo clippy -p shards-io --all-targets --features rustls-ring -- -D warnings

  wasm:
    # The engine runs on wasm without Asyncify; this runs the acceptance
    # tests as a wasm32-wasip1 binary under Node's WASI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup target add wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p shards-core -p shards-lang --target wasm32-wasip1 --lib --tests -- -D warnings
      - name: Run acceptance, metadata and frontend tests on wasm
        run: |
          cargo test -p shards-core --test prototype --test metadata --test trampoline --test host_contract --test registry --test functions --target wasm32-wasip1 --no-run
          cargo test -p shards-lang --test lang --target wasm32-wasip1 --no-run
          node scripts/run-wasi.mjs "$(ls -t target/wasm32-wasip1/debug/deps/prototype-*.wasm | head -1)"
          node scripts/run-wasi.mjs "$(ls -t target/wasm32-wasip1/debug/deps/metadata-*.wasm | head -1)"
          node scripts/run-wasi.mjs "$(ls -t target/wasm32-wasip1/debug/deps/trampoline-*.wasm | head -1)"
          node scripts/run-wasi.mjs "$(ls -t target/wasm32-wasip1/debug/deps/host_contract-*.wasm | head -1)"
          node scripts/run-wasi.mjs "$(ls -t target/wasm32-wasip1/debug/deps/registry-*.wasm | head -1)"
          node scripts/run-wasi.mjs "$(ls -t target/wasm32-wasip1/debug/deps/functions-*.wasm | head -1)"
          node scripts/run-wasi.mjs "$(ls -t target/wasm32-wasip1/debug/deps/lang-*.wasm | head -1)"
