name: ESP32

# The firmware builds only the core and frontend crates (and reads the root
# manifest for workspace package fields).
on:
  push:
    branches: [main]
    paths: &firmware-paths
      - Cargo.toml
      - crates/shards-core/**
      - crates/shards-lang/**
      - examples/esp32/**
      - .github/workflows/esp32.yml
  pull_request:
    paths: *firmware-paths
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  firmware:
    name: Firmware (${{ matrix.chip }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: esp32
            target: xtensa-esp32-espidf
            toolchain: esp
          - chip: esp32s3
            target: xtensa-esp32s3-espidf
            toolchain: esp
          - chip: esp32c3
            target: riscv32imc-esp-espidf
            toolchain: nightly-2026-10-03
    defaults:
      run:
        working-directory: examples/esp32
    env:
      MCU: ${{ matrix.chip }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ESP-IDF build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libudev-dev libusb-1.0-0-dev clang libclang-dev python3-venv
      - name: Install Xtensa Rust
        if: matrix.toolchain == 'esp'
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          version: "1.97.0.0"
          buildtargets: ${{ matrix.chip }}
          ldproxy: true
      - name: Install RISC-V Rust
        if: matrix.chip == 'esp32c3'
        run: |
          rustup toolchain install nightly-2026-10-03 --profile minimal --component rust-src,clippy
          cargo +nightly-2026-10-03 install ldproxy --version 0.3.4 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/esp32 -> target
          key: esp32-${{ matrix.chip }}-${{ matrix.toolchain }}-idf5.5.5
      - name: Link release firmware
        run: >
          cargo +${{ matrix.toolchain }} build --locked --release --target ${{ matrix.target }}
          --message-format=json-render-diagnostics > "$RUNNER_TEMP/build.json"
      # The example's code is chip-independent; lint it once.
      - name: Lint firmware
        if: matrix.chip == 'esp32c3'
        run: cargo +${{ matrix.toolchain }} clippy --locked --release --target ${{ matrix.target }} -- -D warnings
      - name: Collect generated SDK configuration
        run: |
          mkdir -p artifact
          cp target/${{ matrix.target }}/release/shards-esp32 artifact/
          # Take the configuration from this build's esp-idf-sys output
          # directory: the restored cache can hold stale ones.
          out_dir=$(jq -r 'select(.reason == "build-script-executed" and (.package_id | test("esp-idf-sys[@#]"))) | .out_dir' "$RUNNER_TEMP/build.json")
          test "$(printf '%s\n' "$out_dir" | wc -l)" = 1
          cp "$out_dir/sdkconfig" artifact/sdkconfig
          test -s artifact/sdkconfig
          cp sdkconfig.defaults Cargo.lock artifact/
      - name: Upload firmware ELF and build configuration
        uses: actions/upload-artifact@v4
        with:
          name: shards-${{ matrix.chip }}
          if-no-files-found: error
          path: examples/esp32/artifact/
