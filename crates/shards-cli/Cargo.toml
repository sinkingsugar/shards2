[package]
name = "shards-cli"
description = "The shards2 command: check, run and describe Shards programs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "shards2"
path = "src/main.rs"

[dependencies]
shards-core = { path = "../shards-core" }
shards-io = { path = "../shards-io" }
shards-lang = { path = "../shards-lang" }
tokio = { version = "1", features = ["signal"] }
