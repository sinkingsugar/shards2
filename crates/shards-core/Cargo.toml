[package]
name = "shards-core"
description = "Shards 2.0 runtime core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["docs"]
# Documentation prose in shard descriptions (summaries and help). Turn off
# for small builds; the argument contract is kept either way.
docs = []

[target.'cfg(not(target_family = "wasm"))'.dependencies]
corosensei = "0.3.4"

