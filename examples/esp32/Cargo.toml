[package]
name = "shards-esp32"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Separate workspace: ESP-IDF needs build-std and its own toolchain.
[workspace]
resolver = "3"

[[bin]]
name = "shards-esp32"
harness = false

[dependencies]
esp-idf-sys = { version = "=0.38.1", features = ["binstart"] }
shards-core = { path = "../../crates/shards-core", default-features = false }
shards-lang = { path = "../../crates/shards-lang", default-features = false }

[build-dependencies]
embuild = { version = "0.33.5", features = ["espidf"] }

[profile.release]
opt-level = "s"
debug = true
panic = "abort"

[profile.dev]
opt-level = "z"
panic = "abort"
